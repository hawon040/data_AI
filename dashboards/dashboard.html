<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>데이터 시각화 대시보드</title>
<style>
  :root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page-plane:     #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --grid-line:      #e1e0d9;
    --baseline:       #c3c2b7;
    --border-ring:    rgba(11,11,11,0.10);
    --series-1:       #2a78d6; /* blue   - slot 1 */
    --series-2:       #eb6834; /* orange - slot 2 */
    --success-text:   #006300;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page-plane:     #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --grid-line:      #2c2c2a;
    --baseline:       #383835;
    --border-ring:    rgba(255,255,255,0.10);
    --series-1:       #3987e5;
    --series-2:       #d95926;
    --success-text:   #0ca30c;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page-plane);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .page {
    max-width: 1080px;
    margin: 0 auto;
    padding: 24px 16px 64px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .subtitle { color: var(--text-secondary); font-size: 14px; margin: 0; }
  .notice {
    margin-top: 8px;
    font-size: 12px;
    color: var(--text-muted);
  }
  .theme-toggle {
    border: 1px solid var(--border-ring);
    background: var(--surface-1);
    color: var(--text-primary);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
  }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat-tile {
    background: var(--surface-1);
    border: 1px solid var(--border-ring);
    border-radius: 12px;
    padding: 16px 18px;
  }
  .stat-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
  .stat-value { font-size: 28px; font-weight: 600; font-variant-numeric: proportional-nums; }
  .stat-delta { font-size: 12px; margin-top: 4px; color: var(--success-text); }

  .card {
    background: var(--surface-1);
    border: 1px solid var(--border-ring);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 12px;
    flex-wrap: wrap;
  }
  .card-title { font-size: 15px; font-weight: 600; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--text-secondary); }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-swatch { width: 10px; height: 10px; border-radius: 2px; }

  .table-toggle {
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-size: 12px;
    cursor: pointer;
    text-decoration: underline;
    padding: 0;
  }

  .charts-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 720px) {
    .charts-row { grid-template-columns: 1fr; }
  }

  svg text { fill: var(--text-muted); font-size: 11px; }
  .axis-line { stroke: var(--baseline); stroke-width: 1; }
  .grid-line { stroke: var(--grid-line); stroke-width: 1; }
  .line-path { fill: none; stroke-width: 2; }
  .point { r: 3.5; stroke: var(--surface-1); stroke-width: 2; }
  .direct-label { fill: var(--text-secondary); font-size: 11px; }

  .tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--text-primary);
    color: var(--surface-1);
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 6px;
    transform: translate(-50%, -130%);
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.1s;
    z-index: 5;
  }
  .chart-wrap { position: relative; }

  table.data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-top: 8px;
  }
  table.data-table th, table.data-table td {
    text-align: right;
    padding: 6px 8px;
    border-bottom: 1px solid var(--grid-line);
  }
  table.data-table th:first-child, table.data-table td:first-child { text-align: left; }
  table.data-table td { font-variant-numeric: tabular-nums; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="page">

  <header>
    <div>
      <h1>월간 매출 데이터 시각화 대시보드</h1>
      <p class="subtitle">2024년 vs 2025년 · 카테고리 / 지역별 실적</p>
      <p class="notice">※ 예시(샘플) 데이터입니다. 실제 데이터 파일로 교체해서 사용하세요.</p>
    </div>
    <button class="theme-toggle" id="themeToggle" type="button">다크 모드</button>
  </header>

  <section class="stat-grid" aria-label="핵심 지표">
    <div class="stat-tile">
      <div class="stat-label">2025년 누적 매출</div>
      <div class="stat-value">₩842M</div>
      <div class="stat-delta">전년 대비 +18.4%</div>
    </div>
    <div class="stat-tile">
      <div class="stat-label">주문 건수</div>
      <div class="stat-value">12,480</div>
      <div class="stat-delta">전년 대비 +9.1%</div>
    </div>
    <div class="stat-tile">
      <div class="stat-label">평균 주문 단가</div>
      <div class="stat-value">₩67,500</div>
      <div class="stat-delta">전년 대비 +8.6%</div>
    </div>
    <div class="stat-tile">
      <div class="stat-label">활성 사용자</div>
      <div class="stat-value">3,920</div>
      <div class="stat-delta">전년 대비 +12.2%</div>
    </div>
  </section>

  <section class="card">
    <div class="card-head">
      <div class="card-title">월별 매출 추이</div>
      <div class="legend">
        <span class="legend-item"><span class="legend-swatch" style="background:var(--series-1)"></span>2025</span>
        <span class="legend-item"><span class="legend-swatch" style="background:var(--series-2)"></span>2024</span>
      </div>
    </div>
    <div class="chart-wrap">
      <svg id="lineChart" width="100%" height="260" viewBox="0 0 1000 260" preserveAspectRatio="none"></svg>
      <div class="tooltip" id="lineTooltip"></div>
    </div>
    <button class="table-toggle" data-target="lineTable">표로 보기</button>
    <table class="data-table hidden" id="lineTable">
      <thead><tr><th>월</th><th>2025</th><th>2024</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section class="charts-row">
    <div class="card">
      <div class="card-head">
        <div class="card-title">카테고리별 매출</div>
      </div>
      <div class="chart-wrap">
        <svg id="categoryChart" width="100%" height="220" viewBox="0 0 460 220" preserveAspectRatio="none"></svg>
        <div class="tooltip" id="categoryTooltip"></div>
      </div>
      <button class="table-toggle" data-target="categoryTable">표로 보기</button>
      <table class="data-table hidden" id="categoryTable">
        <thead><tr><th>카테고리</th><th>매출 (백만원)</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="card">
      <div class="card-head">
        <div class="card-title">지역별 사용자 수</div>
      </div>
      <div class="chart-wrap">
        <svg id="regionChart" width="100%" height="220" viewBox="0 0 460 220" preserveAspectRatio="none"></svg>
        <div class="tooltip" id="regionTooltip"></div>
      </div>
      <button class="table-toggle" data-target="regionTable">표로 보기</button>
      <table class="data-table hidden" id="regionTable">
        <thead><tr><th>지역</th><th>사용자 수</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

</div>

<script>
  // ---- 샘플 데이터 (실제 데이터로 교체하세요) ----
  const months = ["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];
  const revenue2025 = [52,58,61,67,70,75,78,80,84,88,92,97];
  const revenue2024 = [44,47,50,53,58,60,63,65,68,70,73,76];

  const categories = [
    { name: "의류", value: 312 },
    { name: "가전", value: 268 },
    { name: "식품", value: 190 },
    { name: "가구", value: 121 },
    { name: "뷰티", value: 88 },
  ];

  const regions = [
    { name: "서울", value: 1520 },
    { name: "경기", value: 1180 },
    { name: "부산", value: 540 },
    { name: "대구", value: 380 },
    { name: "기타", value: 300 },
  ];

  const css = getComputedStyle(document.documentElement);
  function cssVar(name) { return getComputedStyle(document.body).getPropertyValue(name).trim() || css.getPropertyValue(name).trim(); }

  // ---------- Line chart (two series) ----------
  function drawLineChart() {
    const svg = document.getElementById("lineChart");
    svg.innerHTML = "";
    const W = 1000, H = 260, padL = 36, padR = 16, padT = 16, padB = 28;
    const plotW = W - padL - padR, plotH = H - padT - padB;
    const maxV = Math.max(...revenue2025, ...revenue2024) * 1.1;
    const x = i => padL + (i / (months.length - 1)) * plotW;
    const y = v => padT + plotH - (v / maxV) * plotH;

    const ns = "http://www.w3.org/2000/svg";
    // gridlines (horizontal, hairline)
    const gridCount = 4;
    for (let g = 0; g <= gridCount; g++) {
      const gy = padT + (g / gridCount) * plotH;
      const line = document.createElementNS(ns, "line");
      line.setAttribute("x1", padL); line.setAttribute("x2", W - padR);
      line.setAttribute("y1", gy); line.setAttribute("y2", gy);
      line.setAttribute("class", "grid-line");
      svg.appendChild(line);
      const label = document.createElementNS(ns, "text");
      label.setAttribute("x", 4); label.setAttribute("y", gy + 3);
      label.textContent = Math.round(maxV * (1 - g / gridCount));
      svg.appendChild(label);
    }
    // x axis
    const axis = document.createElementNS(ns, "line");
    axis.setAttribute("x1", padL); axis.setAttribute("x2", W - padR);
    axis.setAttribute("y1", padT + plotH); axis.setAttribute("y2", padT + plotH);
    axis.setAttribute("class", "axis-line");
    svg.appendChild(axis);
    months.forEach((m, i) => {
      if (i % 2 !== 0) return;
      const t = document.createElementNS(ns, "text");
      t.setAttribute("x", x(i)); t.setAttribute("y", H - 6);
      t.setAttribute("text-anchor", "middle");
      t.textContent = m;
      svg.appendChild(t);
    });

    function path(data) {
      return data.map((v, i) => (i === 0 ? "M" : "L") + x(i) + "," + y(v)).join(" ");
    }

    [
      { data: revenue2024, color: cssVar("--series-2") },
      { data: revenue2025, color: cssVar("--series-1") },
    ].forEach(series => {
      const p = document.createElementNS(ns, "path");
      p.setAttribute("d", path(series.data));
      p.setAttribute("class", "line-path");
      p.setAttribute("stroke", series.color);
      svg.appendChild(p);

      series.data.forEach((v, i) => {
        const c = document.createElementNS(ns, "circle");
        c.setAttribute("cx", x(i)); c.setAttribute("cy", y(v));
        c.setAttribute("class", "point");
        c.setAttribute("fill", series.color);
        c.addEventListener("mouseenter", () => showTooltip("lineTooltip", c, `${months[i]} · ${v}백만원`));
        c.addEventListener("mouseleave", () => hideTooltip("lineTooltip"));
        svg.appendChild(c);
      });

      // direct label at endpoint only
      const lastI = series.data.length - 1;
      const t = document.createElementNS(ns, "text");
      t.setAttribute("x", x(lastI) - 4); t.setAttribute("y", y(series.data[lastI]) - 8);
      t.setAttribute("text-anchor", "end");
      t.setAttribute("class", "direct-label");
      t.textContent = series.data[lastI];
      svg.appendChild(t);
    });

    // table twin
    const tbody = document.querySelector("#lineTable tbody");
    tbody.innerHTML = months.map((m, i) =>
      `<tr><td>${m}</td><td>${revenue2025[i]}</td><td>${revenue2024[i]}</td></tr>`
    ).join("");
  }

  // ---------- Bar chart (single series, nominal categories -> one color) ----------
  function drawBarChart(svgId, tooltipId, tableId, data, unit) {
    const svg = document.getElementById(svgId);
    svg.innerHTML = "";
    const W = 460, H = 220, padL = 70, padR = 16, padT = 12, padB = 28;
    const plotW = W - padL - padR, plotH = H - padT - padB;
    const maxV = Math.max(...data.map(d => d.value)) * 1.15;
    const barH = plotH / data.length;
    const ns = "http://www.w3.org/2000/svg";

    // vertical gridline at 0 (baseline)
    const axis = document.createElementNS(ns, "line");
    axis.setAttribute("x1", padL); axis.setAttribute("x2", padL);
    axis.setAttribute("y1", padT); axis.setAttribute("y2", padT + plotH);
    axis.setAttribute("class", "axis-line");
    svg.appendChild(axis);

    data.forEach((d, i) => {
      const y0 = padT + i * barH + barH * 0.18;
      const h = barH * 0.64;
      const w = (d.value / maxV) * plotW;

      const label = document.createElementNS(ns, "text");
      label.setAttribute("x", padL - 8); label.setAttribute("y", y0 + h / 2 + 4);
      label.setAttribute("text-anchor", "end");
      label.textContent = d.name;
      svg.appendChild(label);

      const rect = document.createElementNS(ns, "rect");
      rect.setAttribute("x", padL); rect.setAttribute("y", y0);
      rect.setAttribute("width", Math.max(w, 2)); rect.setAttribute("height", h);
      rect.setAttribute("rx", 4);
      rect.setAttribute("fill", cssVar("--series-1"));
      rect.setAttribute("class", "bar");
      rect.addEventListener("mouseenter", () => showTooltip(tooltipId, rect, `${d.name} · ${d.value.toLocaleString()}${unit}`));
      rect.addEventListener("mouseleave", () => hideTooltip(tooltipId));
      svg.appendChild(rect);

      const valueLabel = document.createElementNS(ns, "text");
      valueLabel.setAttribute("x", padL + w + 6); valueLabel.setAttribute("y", y0 + h / 2 + 4);
      valueLabel.setAttribute("class", "direct-label");
      valueLabel.textContent = d.value.toLocaleString();
      svg.appendChild(valueLabel);
    });

    const tbody = document.querySelector(`#${tableId} tbody`);
    tbody.innerHTML = data.map(d => `<tr><td>${d.name}</td><td>${d.value.toLocaleString()}</td></tr>`).join("");
  }

  function showTooltip(id, target, text) {
    const tip = document.getElementById(id);
    const rect = target.getBoundingClientRect();
    const wrap = tip.parentElement.getBoundingClientRect();
    tip.textContent = text;
    tip.style.left = (rect.left + rect.width / 2 - wrap.left) + "px";
    tip.style.top = (rect.top - wrap.top) + "px";
    tip.style.opacity = "1";
  }
  function hideTooltip(id) {
    document.getElementById(id).style.opacity = "0";
  }

  function renderAll() {
    drawLineChart();
    drawBarChart("categoryChart", "categoryTooltip", "categoryTable", categories, "백만원");
    drawBarChart("regionChart", "regionTooltip", "regionTable", regions, "명");
  }

  document.querySelectorAll(".table-toggle").forEach(btn => {
    btn.addEventListener("click", () => {
      const el = document.getElementById(btn.dataset.target);
      el.classList.toggle("hidden");
      btn.textContent = el.classList.contains("hidden") ? "표로 보기" : "표 숨기기";
    });
  });

  const themeToggle = document.getElementById("themeToggle");
  themeToggle.addEventListener("click", () => {
    const root = document.documentElement;
    const isDark = root.getAttribute("data-theme") === "dark";
    root.setAttribute("data-theme", isDark ? "light" : "dark");
    themeToggle.textContent = isDark ? "다크 모드" : "라이트 모드";
    renderAll();
  });

  renderAll();
  window.addEventListener("resize", renderAll);
</script>

</body>
</html>
