# api.py 접근 로그의 ts는 로컬 시각 "2026-11-07T14:30:05" 형식이다.
[PARSER]
    Name        json_ts
    Format      json
    Time_Key    ts
    Time_Format %Y-%m-%dT%H:%M:%S
    Time_Keep   On

# 공공데이터 호출 로그(api_calls.jsonl)의 time은 UTC ISO 형식이다: "2026-11-07T05:30:05.123+00:00"
[PARSER]
    Name        json_iso
    Format      json
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z
    Time_Keep   On
