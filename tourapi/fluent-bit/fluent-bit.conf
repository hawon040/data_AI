# TourLink 접근 로그 수집 (4주차 C:\logslab 설정과 같은 구조)
#   tail(JSON 파서, tail.db, filesystem 버퍼) → file 출력
#
# 처음 한 번 (tourapi 폴더에서): mkdir logsluent-state logsluent-out logsluent-buffer
# 실행 (tourapi 폴더에서, 경로는 모두 tourapi 기준 상대 경로):
#   C:\logslab\fluent-bit\fluent-bit-5.1.3-win64\bin\fluent-bit.exe -c fluent-bit\fluent-bit.conf
# 입력 1: logs/access.jsonl  (api.py가 ACCESS_LOG=1일 때 남김)
#   출력: logs/fluent-out/access.jsonl  → tourism_platform.lake.access_log가 MongoDB access_logs에 넣음
# 입력 2: ../tourism_platform/data/logs/api_calls.jsonl  (datagokr_client.fetch가 공공데이터 호출마다 남김)
#   출력: logs/fluent-out/api_calls.jsonl  → tourism_platform.lake.api_call_log가 MongoDB api_calls에 넣음
# 두 입력은 Tag로 구분하고, 출력도 Match로 나눠 파일이 섞이지 않게 한다.
# 메트릭: http://127.0.0.1:2020/api/v1/metrics
# logs/ 아래 상태·버퍼·출력은 .gitignore로 커밋하지 않는다.

[SERVICE]
    Flush         1
    Log_Level     info
    Parsers_File  parsers.conf
    storage.path  logs/fluent-buffer
    HTTP_Server   On
    HTTP_Listen   127.0.0.1
    HTTP_Port     2020

[INPUT]
    Name            tail
    Path            logs/access.jsonl
    Tag             tourapi.access
    DB              logs/fluent-state/tail.db
    Read_from_Head  On
    Parser          json_ts
    storage.type    filesystem

[INPUT]
    Name            tail
    Path            ../tourism_platform/data/logs/api_calls.jsonl
    Tag             tourapi.apicall
    DB              logs/fluent-state/tail_api_calls.db
    Read_from_Head  On
    Parser          json_iso
    storage.type    filesystem

[OUTPUT]
    Name    file
    Match   tourapi.access
    Path    logs/fluent-out
    File    access.jsonl
    Format  plain

[OUTPUT]
    Name    file
    Match   tourapi.apicall
    Path    logs/fluent-out
    File    api_calls.jsonl
    Format  plain

# 실행 뒤 확인 (tourism_platform 폴더에서): 입력과 출력이 빠짐없이 같은지 비교한다.
#   python -m tourism_platform.lake.fluent_check
# time 파싱: Fluent Bit 버전에 따라 "+00:00" 형식의 %z를 읽지 못해 경고가 나올 수 있다. 그래도 기록은 그대로 나가고,
# 적재 코드(lake/api_call_log.py)는 기록 안의 time 값을 직접 읽으므로 결과에는 영향이 없다.
