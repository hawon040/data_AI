[project]
name = "tourism-platform"
version = "0.1.0"
description = "TourLink — 일행·날씨 맞춤 관광지 추천과 대비 정보 계산 모듈"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
lake = ["pymongo>=4.6", "pyarrow>=15", "tabulate>=0.9"]
notebook = ["notebook>=7", "nbconvert>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
